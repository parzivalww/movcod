<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Promoções</title>
  <meta name="description" content="As melhores ofertas e promoções selecionadas para você!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #F1F5F9; color: #1E293B; }

    .header {
      background: linear-gradient(135deg, #4C1D95 0%, #7C3AED 60%, #EC4899 100%);
      color: white;
      padding: 40px 20px;
      text-align: center;
    }
    .header h1 { font-family: 'Poppins', sans-serif; font-size: 2rem; margin-bottom: 8px; }
    .header p { opacity: .85; font-size: 1rem; }

    .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid #E2E8F0;
      margin-bottom: 20px;
    }

    .filter-btn {
      padding: 7px 16px;
      border-radius: 20px;
      border: 1.5px solid #E2E8F0;
      background: white;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      color: #64748B;
      font-family: 'Inter', sans-serif;
    }
    .filter-btn.active, .filter-btn:hover {
      background: #7C3AED;
      border-color: #7C3AED;
      color: white;
    }

    #search-input {
      flex: 1;
      min-width: 180px;
      padding: 9px 16px;
      border: 1.5px solid #E2E8F0;
      border-radius: 20px;
      font-size: .875rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color .15s;
    }
    #search-input:focus { border-color: #7C3AED; }

    #catalog-count { font-size: .82rem; color: #64748B; white-space: nowrap; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }

    .footer {
      text-align: center;
      padding: 32px;
      color: #94A3B8;
      font-size: .8rem;
      margin-top: 32px;
      border-top: 1px solid #E2E8F0;
    }
    .footer a { color: #7C3AED; text-decoration: none; }

    @media (max-width: 600px) {
      .header h1 { font-size: 1.4rem; }
      .filters { flex-direction: column; align-items: stretch; }
      #search-input { min-width: 100%; }
      .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    }

    @media (max-width: 380px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 id="cat-store-name">🔥 Minhas Promoções</h1>
    <p id="cat-store-desc">As melhores ofertas selecionadas para você!</p>
  </div>

  <div class="container">
    <div class="filters">
      <input type="text" id="search-input" placeholder="🔍 Buscar produto...">
      <button class="filter-btn active" data-filter="all">Todos</button>
      <button class="filter-btn" data-filter="amazon">🛒 Amazon</button>
      <button class="filter-btn" data-filter="shopee">🟠 Shopee</button>
      <button class="filter-btn" data-filter="mercadolivre">🛍️ M. Livre</button>
      <span id="catalog-count"></span>
    </div>

    <div class="grid" id="catalog-grid">
      <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:#64748B">
        <div style="font-size:2.5rem;margin-bottom:10px">⏳</div>
        <p>Carregando produtos...</p>
      </div>
    </div>

    <div class="footer">
      Criado com ❤️ usando <a href="index.html">Divulga Pro</a>
    </div>
  </div>

  <script src="js/catalog.js"></script>
</body>
</html>
